<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorpion Code Studio | Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151921;
            --bg-input: #0d1117;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --border: #232733;
            --danger: #ed4245;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.8rem; font-weight: 700; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            flex: 1;
        }

        @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .panel-header {
            background: rgba(0,0,0,0.25);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .btn-action {
            background: var(--border);
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover { background: var(--accent); color: #fff; }

        .file-wrapper { position: relative; display: inline-block; }
        .file-wrapper input[type="file"] {
            position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 480px;
            background: var(--bg-input);
            border: none;
            color: #89ddff;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            padding: 16px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 0;
            gap: 12px;
        }

        .btn-convert {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(88, 101, 242, 0.35);
            transition: all 0.2s ease;
        }

        .btn-convert:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .btn-clear {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px 20px;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-clear:hover { background: rgba(237, 66, 69, 0.1); color: var(--danger); border-color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <h1><span>Scorpion</span> Code Studio</h1>
        <p>Convertitore BDScript ➔ Java JDA v5</p>
    </header>

    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Sorgente BDScript</span>
                <div class="file-wrapper">
                    <button class="btn-action">📁 Carica File</button>
                    <input type="file" id="fileInput" accept=".txt,.bds">
                </div>
            </div>
            <textarea id="bdscriptInput" placeholder="// Incolla qui il codice BDScript..."></textarea>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Codice Java (JDA)</span>
                <button class="btn-action" onclick="copyJava()">📋 Copia Codice</button>
            </div>
            <textarea id="javaOutput" readonly placeholder="// Il codice Java apparirà qui..."></textarea>
        </div>
    </div>

    <div class="controls">
        <button class="btn-clear" onclick="clearAll()">Pulisci</button>
        <button class="btn-convert" onclick="convertCode()">Converti Ora in Java</button>
    </div>

    <script>
        // Caricamento File .txt o .bds
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('bdscriptInput').value = e.target.result;
            };
            reader.readAsText(file);
        });

        // Funzione Pulisci
        function clearAll() {
            document.getElementById('bdscriptInput').value = '';
            document.getElementById('javaOutput').value = '';
        }

        // Funzione Copia
        function copyJava() {
            const out = document.getElementById('javaOutput');
            if (!out.value.trim()) return;
            navigator.clipboard.writeText(out.value);
            alert("Codice Java copiato negli appunti!");
        }

        // Engine di Conversione Sicuro senza Regex bloccanti
        function convertCode() {
            const rawInput = document.getElementById('bdscriptInput').value;
            if (!rawInput.trim()) {
                alert("Inserisci prima lo script in BDScript!");
                return;
            }

            try {
                const hasDelete = rawInput.includes('$deletecommand');
                const hasRandom = rawInput.includes('$random[');
                const hasTime = rawInput.includes('$time[');
                const hasSuppress = rawInput.includes('$suppressErrors') \vert{}\vert{} rawInput.includes('$embedSuppressErrors');
                const hasLog = rawInput.includes('$sendEmbedMessage');

                let java = `import net.dv8tion.jda.api.EmbedBuilder;\n`;
                if (hasLog) java += `import net.dv8tion.jda.api.entities.channel.concrete.TextChannel;\n`;
                java += `import net.dv8tion.jda.api.events.message.MessageReceivedEvent;\n`;
                java += `import net.dv8tion.jda.api.hooks.ListenerAdapter;\n`;
                java += `import java.awt.Color;\n`;
                if (hasTime) {
                    java += `import java.time.LocalDateTime;\n`;
                    java += `import java.time.ZoneId;\n`;
                    java += `import java.time.format.DateTimeFormatter;\n`;
                }
                if (hasRandom) {
                    java += `import java.util.Random;\n`;
                }

                java += `\npublic class CommandListener extends ListenerAdapter {\n\n`;
                if (hasRandom) {
                    java += `    private final Random random = new Random();\n\n`;
                }

                java += `    @Override\n`;
                java += `    public void onMessageReceived(MessageReceivedEvent event) {\n`;
                java += `        if (event.getAuthor().isBot() || !event.isFromGuild()) return;\n\n`;
                java += `        String rawMessage = event.getMessage().getContentRaw();\n`;
                java += `        String[] args = rawMessage.split("\\\\s+");\n\n`;

                if (hasSuppress) {
                    java += `        try {\n`;
                }

                // $argsCheck
                const argsMatch = rawInput.match(/\$argsCheck\[(\d+)[>;]?\s*;?\s*([\s\S]*?)\]/);
                if (argsMatch) {
                    const minArgs = parseInt(argsMatch[1]);
                    const errMsg = argsMatch[2] ? argsMatch[2].replace(/"/g, '\\"').trim() : "Sintassi errata!";
                    java += `            if (args.length - 1 < ${minArgs}) {\n`;
                    java += `                event.getChannel().sendMessage("${errMsg}").queue();\n`;
                    java += `                return;\n`;
                    java += `            }\n\n`;
                }

                if (hasDelete) {
                    java += `            event.getMessage().delete().queue();\n`;
                }

                java += `            String actionMessage = rawMessage.indexOf(' ') != -1 ? rawMessage.substring(rawMessage.indexOf(' ') + 1) : "";\n`;

                if (hasTime) {
                    java += `            LocalDateTime now = LocalDateTime.now(ZoneId.of("Europe/Rome"));\n`;
                    java += `            String formattedDate = now.format(DateTimeFormatter.ofPattern("HH:mm dd/MM/yyyy"));\n`;
                }

                // Main Embed
                java += `\n            EmbedBuilder mainEmbed = new EmbedBuilder();\n`;

                const descMatch = rawInput.match(/\$description\[([\s\S]*?)\]/);
                if (descMatch) {
                    java += `            mainEmbed.setDescription(${formatVars(descMatch[1])});\n`;
                }

                const titleMatch = rawInput.match(/\$title\[([\s\S]*?)\]/);
                if (titleMatch) {
                    java += `            mainEmbed.setTitle(${formatVars(titleMatch[1])});\n`;
                }

                if (hasRandom) {
                    java += `            mainEmbed.setColor(new Color(random.nextInt(0xFFFFFF)));\n`;
                } else {
                    java += `            mainEmbed.setColor(Color.CYAN);\n`;
                }

                const footerMatch = rawInput.match(/\$footer\[([\s\S]*?)\]/);
                if (footerMatch) {
                    java += `            mainEmbed.setFooter(${formatVars(footerMatch[1])});\n`;
                }

                java += `            event.getChannel().sendMessageEmbeds(mainEmbed.build()).queue();\n`;

                if (hasLog) {
                    java += `\n            // Log System\n`;
                    java += `            String logChannelId = "ID_CANALE_LOG";\n`;
                    java += `            TextChannel logChannel = event.getGuild().getTextChannelById(logChannelId);\n`;
                    java += `            if (logChannel != null) {\n`;
                    java += `                EmbedBuilder logEmbed = new EmbedBuilder();\n`;
                    java += `                logEmbed.setTitle("LOGS BOT");\n`;
                    java += `                logEmbed.setColor(Color.decode("#FF00CA"));\n`;
                    java += `                logEmbed.setDescription("Eseguito da " + event.getAuthor().getAsMention() + "\\nMessaggio: " + actionMessage);\n`;
                    java += `                logChannel.sendMessageEmbeds(logEmbed.build()).queue();\n`;
                    java += `            }\n`;
                }

                if (hasSuppress) {
                    java += `\n        } catch (Exception e) {\n`;
                    java += `            EmbedBuilder err = new EmbedBuilder();\n`;
                    java += `            err.setTitle("ERRORE COMANDO");\n`;
                    java += `            err.setColor(Color.RED);\n`;
                    java += `            event.getChannel().sendMessageEmbeds(err.build()).queue();\n`;
                    java += `        }\n`;
                }

                java += `    }\n`;
                java += `}\n`;

                document.getElementById('javaOutput').value = java;

            } catch (err) {
                alert("Errore di parsing: " + err.message);
            }
        }

        function formatVars(str) {
            let res = JSON.stringify(str);
            res = res.replace(/\\\$authorID/g, '" + event.getAuthor().getAsMention() + "');
            res = res.replace(/\\\$message/g, '" + actionMessage + "');
            res = res.replace(/\\\$serverName\\[.*?\\\]/g, '" + event.getGuild().getName() + "');
            res = res.replace(/\\\$guildID/g, '" + event.getGuild().getId() + "');
            res = res.replace(/\\\$hour:\\\$minute \\\$date/g, '" + formattedDate + "');
            return res;
        }
    </script>
</body>
</html>
