<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorpion Studio | BDScript ➔ Java JDA Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f111a;
            --bg-card: #181a26;
            --bg-input: #090a10;
            --accent-primary: #7289da;
            --accent-hover: #5b6eae;
            --text-main: #e1e7ed;
            --text-muted: #828a9a;
            --border-color: #272b3c;
            --success: #43b581;
            --danger: #f04747;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        header h1 span {
            color: var(--accent-primary);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .panel-header {
            background: rgba(0,0,0,0.2);
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .file-btn-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-btn {
            background: var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .file-btn:hover {
            background: var(--accent-primary);
            color: #fff;
        }

        .file-btn-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 480px;
            background: var(--bg-input);
            border: none;
            color: #89ddff;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            padding: 16px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: #43495d;
        }

        .actions-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            gap: 16px;
        }

        .btn-convert {
            background: var(--accent-primary);
            color: #fff;
            border: none;
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(114, 137, 218, 0.4);
            transition: all 0.2s ease;
        }

        .btn-convert:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-copy {
            background: #2f3136;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-copy:hover {
            background: #393c43;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .status-ready { background: rgba(67, 181, 129, 0.2); color: var(--success); }
    </style>
</head>
<body>

    <header>
        <h1><span>Scorpion</span> Code Studio</h1>
        <p>Convertitore Avanzato da BDScript (Bot Designer for Discord) a Java JDA v5</p>
    </header>

    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Sorgente BDScript</span>
                <div class="file-btn-wrapper">
                    <span class="file-btn">Carica .txt / .bds</span>
                    <input type="file" id="fileInput" accept=".txt,.bds">
                </div>
            </div>
            <textarea id="bdscriptInput" placeholder="// Incolla qui il tuo codice BDScript...
$nomention
$deletecommand$description[
**AZIONI RP**
<@$authorID>$message
]
$color[$random[0;9999]]"></textarea>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Output Java JDA v5</span>
                <button class="btn-copy" onclick="copyJavaCode()">Copia Codice</button>
            </div>
            <textarea id="javaOutput" readonly placeholder="// Il codice Java compilato apparirà qui..."></textarea>
        </div>
    </div>

    <div class="actions-bar">
        <button class="btn-convert" onclick="processConversion()">Converti Ora in Java</button>
    </div>

    <script>
        // Caricamento File
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('bdscriptInput').value = e.target.result;
            };
            reader.readAsText(file);
        });

        function copyJavaCode() {
            const output = document.getElementById('javaOutput');
            if (!output.value) return;
            navigator.clipboard.writeText(output.value);
            alert("Codice Java copiato negli appunti!");
        }

        // Engine di Parsing BDScript -> Java JDA
        function processConversion() {
            const input = document.getElementById('bdscriptInput').value;
            if (!input.trim()) return;

            let hasDelete = input.includes('$deletecommand');
            let hasArgsCheck = input.match(/\$argsCheck\[(\d+)[>;]?\s*;?\s*(.*?)\]/);
            let hasRandomColor = input.includes('$random[');
            let hasTime = input.includes('$time[');
            let hasLogEmbed = input.includes('$sendEmbedMessage');
            let hasSuppressErrors = input.includes('$suppressErrors') \vert{}\vert{} input.includes('$embedSuppressErrors');

            let java = `import net.dv8tion.jda.api.EmbedBuilder;\n`;
            java += `import net.dv8tion.jda.api.entities.channel.concrete.TextChannel;\n`;
            java += `import net.dv8tion.jda.api.events.message.MessageReceivedEvent;\n`;
            java += `import net.dv8tion.jda.api.hooks.ListenerAdapter;\n`;
            java += `import java.awt.Color;\n`;
            if (hasTime) {
                java += `import java.time.LocalDateTime;\n`;
                java += `import java.time.ZoneId;\n`;
                java += `import java.time.format.DateTimeFormatter;\n`;
            }
            if (hasRandomColor) {
                java += `import java.util.Random;\n`;
            }

            java += `\npublic class CommandListener extends ListenerAdapter {\n\n`;
            if (hasRandomColor) {
                java += `    private final Random random = new Random();\n\n`;
            }

            java += `    @Override\n`;
            java += `    public void onMessageReceived(MessageReceivedEvent event) {\n`;
            java += `        if (event.getAuthor().isBot() || !event.isFromGuild()) return;\n\n`;
            java += `        String rawMessage = event.getMessage().getContentRaw();\n`;
            java += `        String[] args = rawMessage.split("\\\\s+");\n\n`;

            if (hasSuppressErrors) {
                java += `        try {\n`;
            }

            // Argomenti
            if (hasArgsCheck) {
                let minArgs = parseInt(hasArgsCheck[1]);
                let errorMsg = hasArgsCheck[2] || "Sintassi comando non valida!";
                java += `            if (args.length - 1 < ${minArgs}) {\n`;
                java += `                event.getChannel().sendMessage("${clean(errorMsg)}").queue();\n`;
                java += `                return;\n`;
                java += `            }\n\n`;
            }

            // Eliminazione messaggio
            if (hasDelete) {
                java += `            event.getMessage().delete().queue();\n`;
            }

            java += `            String actionMessage = rawMessage.indexOf(' ') != -1 ? rawMessage.substring(rawMessage.indexOf(' ') + 1) : "";\n`;
            
            if (hasTime) {
                java += `            LocalDateTime now = LocalDateTime.now(ZoneId.of("Europe/Rome"));\n`;
                java += `            String formattedDate = now.format(DateTimeFormatter.ofPattern("HH:mm dd/MM/yyyy"));\n`;
            }

            // Parsing Embed Principale
            java += `\n            EmbedBuilder mainEmbed = new EmbedBuilder();\n`;
            
            let descMatch = input.match(/\$description\[([\s\S]*?)\]/);
            if (descMatch) {
                let parsedDesc = parseBDVars(descMatch[1]);
                java += `            mainEmbed.setDescription(${parsedDesc});\n`;
            }

            let titleMatch = input.match(/\$title\[(.*?)\]/);
            if (titleMatch) {
                java += `            mainEmbed.setTitle(${parseBDVars(titleMatch[1])});\n`;
            }

            if (hasRandomColor) {
                java += `            mainEmbed.setColor(new Color(random.nextInt(0xFFFFFF)));\n`;
            } else {
                java += `            mainEmbed.setColor(Color.CYAN);\n`;
            }

            let footerMatch = input.match(/\$footer\[(.*?)\]/);
            if (footerMatch) {
                java += `            mainEmbed.setFooter(${parseBDVars(footerMatch[1])});\n`;
            }

            java += `            event.getChannel().sendMessageEmbeds(mainEmbed.build()).queue();\n`;

            // Parsing Embed Log
            if (hasLogEmbed) {
                java += `\n            // Invio Embed di Log\n`;
                java += `            String logChannelId = "ID_CANALE_LOG"; // Inserisci l'ID del canale log\n`;
                java += `            TextChannel logChannel = event.getGuild().getTextChannelById(logChannelId);\n`;
                java += `            if (logChannel != null) {\n`;
                java += `                EmbedBuilder logEmbed = new EmbedBuilder();\n`;
                java += `                logEmbed.setColor(Color.decode("#FF00CA"));\n`;
                java += `                logEmbed.setDescription("Log operazione eseguita da " + event.getAuthor().getAsMention());\n`;
                java += `                logChannel.sendMessageEmbeds(logEmbed.build()).queue();\n`;
                java += `            }\n`;
            }

            if (hasSuppressErrors) {
                java += `\n        } catch (Exception e) {\n`;
                java += `            EmbedBuilder err = new EmbedBuilder();\n`;
                java += `            err.setTitle("❌ Errore durante l'esecuzione");\n`;
                java += `            err.setColor(Color.RED);\n`;
                java += `            event.getChannel().sendMessageEmbeds(err.build()).queue();\n`;
                java += `        }\n`;
            }

            java += `    }\n`;
            java += `}\n`;

            document.getElementById('javaOutput').value = java;
        }

        function parseBDVars(str) {
            let res = JSON.stringify(str);
            res = res.replace(/\\\$authorID/g, '" + event.getAuthor().getAsMention() + "');
            res = res.replace(/\\\$message/g, '" + actionMessage + "');
            res = res.replace(/\\\$serverName\\[.*?\\\]/g, '" + event.getGuild().getName() + "');
            res = res.replace(/\\\$hour:\\\$minute \\\$date/g, '" + formattedDate + "');
            return res;
        }

        function clean(str) {
            return str.replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
